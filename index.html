<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2f7">
  <meta name="description" content="Приглашение для Варвары">
  <title>Для Варвары</title>
  <style>
    :root{color-scheme:light;--ink:#403745;--muted:#827785;--accent:#987da8;--line:#e8dfe9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;overflow-x:hidden;background:radial-gradient(ellipse at 12% 18%,#ead9e9 0,transparent 38%),radial-gradient(ellipse at 88% 82%,#f2dce5 0,transparent 36%),#f8f2f6;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#bfa5bd .7px,transparent .7px);background-size:31px 31px}
    .shell{width:min(100%,610px);position:relative;z-index:1}
    .card{position:relative;overflow:hidden;text-align:center;padding:clamp(48px,8vw,72px) clamp(24px,6vw,58px);border:1px solid #d9c1d2;background:linear-gradient(135deg,#fffdfb 0%,#fff9fc 52%,#fcf3f8 100%);border-radius:7px 34px 7px 34px;box-shadow:0 24px 65px #72566c20,0 5px 0 #eadce7,inset 0 0 0 5px #fff,inset 0 0 0 6px #ead8e5;transition:box-shadow .5s}
    .card:before,.card:after{position:absolute;pointer-events:none;color:#d4aec5;font-family:Georgia,serif;font-size:30px;line-height:1;opacity:.8}
    .card:before{content:"✿";top:18px;left:21px}
    .card:after{content:"❀";right:21px;bottom:18px}
    .screen{position:relative;z-index:1;animation:appear .55s ease both}
    .hidden{display:none!important}
    .mark{width:46px;height:46px;margin:0 auto 24px;border:1px solid #d8c8de;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:Georgia,serif;font-size:24px}
    h1{margin:0 auto 20px;max-width:480px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7.5vw,56px);line-height:1.08;letter-spacing:-.035em;font-weight:500;color:#443849}
    h1:before{content:"✧  ❀  ✧";display:block;margin:0 auto 22px;color:#b88da9;font-family:Georgia,serif;font-size:23px;letter-spacing:.18em;font-weight:400}
    .accent{color:#92769f}
    p{margin:0 auto 23px;max-width:430px;font-size:15px;line-height:1.85;color:var(--muted)}
    .button-wrap{margin-top:29px}
    button{appearance:none;border:1px solid #8c687f;border-radius:5px 20px 5px 20px;padding:15px 30px;min-height:52px;font:inherit;font-size:14px;font-weight:650;letter-spacing:.025em;color:#fff;background:linear-gradient(135deg,#a27f9c,#856684);box-shadow:0 5px 0 #6f526f,0 12px 24px #78618422;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
    button:hover{transform:translateY(-2px);background:linear-gradient(135deg,#aa86a3,#765b80);box-shadow:0 7px 0 #6f526f,0 14px 26px #78618430}
    button:active{transform:scale(.98)}
    button:focus-visible{outline:2px solid #bba8c5;outline-offset:4px}
    .question{font-size:clamp(34px,7vw,49px)}
    footer{text-align:center;position:relative;z-index:1;margin-top:16px;color:#9c8d9f;font-size:11px;letter-spacing:.03em}
    .particle{position:fixed;z-index:10;pointer-events:none;top:-24px;width:8px;height:8px;border-radius:50%;background:#c4a9ce;opacity:0;animation:fall linear forwards;will-change:transform,opacity}
    .lily{position:fixed;z-index:20;left:0;top:0;width:clamp(25px,5vw,46px);height:clamp(25px,5vw,46px);pointer-events:none;will-change:transform,opacity;animation:lily-burst var(--duration) cubic-bezier(.12,.68,.24,1) forwards;filter:drop-shadow(0 3px 5px #8d6a8c30)}
    .particle:nth-child(3n){background:#d9b9c8;width:5px;height:5px}
    .particle:nth-child(3n + 1){background:#e4d7e9;width:10px;height:10px}
    .glow{box-shadow:0 0 0 5px #e5d9eb65,0 25px 90px #9d82aa25,inset 0 0 0 1px #eee6ef}
    @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fall{0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0}12%{opacity:.85}100%{transform:translate3d(var(--drift),110vh,0) rotate(300deg);opacity:0}}
    @keyframes lily-burst{0%{transform:translate(-50%,-50%) scale(.25) rotate(0deg);opacity:0}12%{opacity:1}72%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--rotation));opacity:0}}
    @media(max-width:480px){body{padding:15px}.card{border-radius:6px 25px 6px 25px;padding:48px 21px}.card:before{top:13px;left:14px;font-size:24px}.card:after{right:14px;bottom:13px;font-size:24px}h1:before{margin-bottom:18px}p{font-size:14px}button{width:100%;max-width:310px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" id="card">
      <div class="screen" id="secondScreen">
        <h1 class="question">Варвара, ты придёшь на мой день рождения?</h1>
        <div class="button-wrap"><button id="yesButton">Да, приду</button></div>
        <p id="response" class="hidden" role="status" aria-live="polite" style="margin-top:24px;margin-bottom:0">Я буду рад тебя видеть! Я выбираю тебя ❤️</p>
      </div>
    </section>
    <footer>Сделано специально для тебя</footer>
  </main>
  <script>
    const card = document.getElementById('card');
    const response = document.getElementById('response');
    function celebrate() {
      const button = document.getElementById('yesButton');
      const rect = button.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      const lilySvg = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g stroke="#b887a8" stroke-width="1.1" stroke-linejoin="round"><path fill="#fff8fc" d="M32 34C16 31 9 18 17 7c8 7 14 15 15 27Z"/><path fill="#f5dbe9" d="M32 34C24 17 28 5 32 2c5 9 7 20 0 32Z"/><path fill="#fff4fa" d="M32 34C39 16 49 11 56 14c-2 12-11 19-24 20Z"/><path fill="#f1d0e1" d="M32 34C48 29 57 36 58 45c-12 4-21-1-26-11Z"/><path fill="#fff8fc" d="M32 34C38 49 32 58 25 61c-7-10-5-19 7-27Z"/><path fill="#f5dbe9" d="M32 34C19 46 9 43 5 36c7-9 16-10 27-2Z"/></g><path d="M32 32l-8-13m8 13 8-15m-8 15 15-4m-15 4 1 16m-1-16-14 4" stroke="#b18a39" stroke-width="1.5" stroke-linecap="round"/><g fill="#c5a052"><circle cx="24" cy="19" r="1.8"/><circle cx="40" cy="17" r="1.8"/><circle cx="47" cy="28" r="1.8"/><circle cx="33" cy="48" r="1.8"/><circle cx="18" cy="36" r="1.8"/></g><path d="M32 33Q28 43 20 47" fill="none" stroke="#6e9a70" stroke-width="2" stroke-linecap="round"/></svg>';
      for (let i = 0; i < 220; i++) {
        const lily = document.createElement('span');
        lily.className = 'lily';
        lily.innerHTML = lilySvg;
        lily.style.left = originX + 'px';
        lily.style.top = originY + 'px';
        lily.style.setProperty('--dx', (Math.random() * window.innerWidth * 1.15 - window.innerWidth * .575) + 'px');
        lily.style.setProperty('--dy', (Math.random() * window.innerHeight * 1.2 - window.innerHeight * .65) + 'px');
        lily.style.setProperty('--duration', (3.2 + Math.random() * 2.8) + 's');
        lily.style.setProperty('--scale', (0.55 + Math.random() * 1.05).toFixed(2));
        lily.style.setProperty('--rotation', (Math.random() * 900 - 450) + 'deg');
        document.body.appendChild(lily);
        lily.addEventListener('animationend', () => lily.remove(), {once:true});
      }
      for (let i = 0; i < 150; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.animationDuration = (2.8 + Math.random() * 2.8) + 's';
        particle.style.animationDelay = (Math.random() * .7) + 's';
        particle.style.setProperty('--drift', (Math.random() * 150 - 75) + 'px');
        document.body.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove(), {once:true});
      }
      card.classList.add('glow');
      window.setTimeout(() => card.classList.remove('glow'), 4200);
    }
    document.getElementById('yesButton').addEventListener('click', (event) => {
      const button = event.currentTarget;
      if (button.disabled) return;
      button.disabled = true;
      button.setAttribute('aria-pressed', 'true');
      button.classList.add('hidden');
      response.classList.remove('hidden');
      celebrate();
    });
  </script>
</body>
</html>
