<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2f7">
  <meta name="description" content="Приглашение для Варвары">
  <title>Для Варвары</title>
  <style>
    :root{color-scheme:light;--ink:#403745;--muted:#827785;--accent:#987da8;--line:#e8dfe9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;overflow-x:hidden;background:radial-gradient(ellipse at 12% 18%,#ead9e9 0,transparent 38%),radial-gradient(ellipse at 88% 82%,#f2dce5 0,transparent 36%),#f8f2f6;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#bfa5bd .7px,transparent .7px);background-size:31px 31px}
    .shell{width:min(100%,610px);position:relative;z-index:1}
    .card{position:relative;overflow:hidden;text-align:center;padding:clamp(48px,8vw,72px) clamp(24px,6vw,58px);border:1px solid #cba9c4;background:linear-gradient(135deg,#fff9fd 0%,#fbf0f8 48%,#f3e3f0 100%);border-radius:7px 34px 7px 34px;box-shadow:0 26px 70px #72566c2b,0 5px 0 #e2c9dd,inset 0 0 0 5px #fff9fd,inset 0 0 0 6px #e4cddd;transition:box-shadow .5s}
    .card:before,.card:after{position:absolute;pointer-events:none;color:#d4aec5;font-family:Georgia,serif;font-size:30px;line-height:1;opacity:.8}
    .card:before{content:"✿";top:18px;left:21px}
    .card:after{content:"❀";right:21px;bottom:18px}
    .screen{position:relative;z-index:1;animation:appear .55s ease both}
    .hidden{display:none!important}
    .mark{width:46px;height:46px;margin:0 auto 24px;border:1px solid #d8c8de;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:Georgia,serif;font-size:24px}
    h1{margin:0 auto 20px;max-width:480px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7.5vw,56px);line-height:1.08;letter-spacing:-.035em;font-weight:500;color:#443849}
    h1:before{content:"✧  ❀  ✧";display:block;margin:0 auto 22px;color:#b88da9;font-family:Georgia,serif;font-size:23px;letter-spacing:.18em;font-weight:400}
    .accent{color:#92769f}
    p{margin:0 auto 23px;max-width:430px;font-size:15px;line-height:1.85;color:var(--muted)}
    .button-wrap{margin-top:29px}
    button{appearance:none;position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(255,255,255,.82);border-radius:999px;padding:15px 32px;min-height:52px;font:inherit;font-size:14px;font-weight:650;letter-spacing:.01em;color:#654d69;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.35) 45%,rgba(235,215,242,.58));box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(167,132,180,.15),0 8px 24px rgba(114,83,126,.13);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
    button:before{content:"";position:absolute;inset:1px 1px auto;height:48%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));z-index:-1;pointer-events:none}
    button:hover{transform:translateY(-1px);background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.48) 45%,rgba(229,205,239,.7));box-shadow:inset 0 1px 1px #fff,inset 0 -1px 2px #a784b426,0 11px 28px #72537e29}
    button:active{transform:scale(.97);box-shadow:inset 0 1px 5px rgba(114,83,126,.16),0 3px 12px rgba(114,83,126,.12)}
    button:focus-visible{outline:2px solid #bba8c5;outline-offset:4px}
    .question{font-size:clamp(34px,7vw,49px)}
    footer{text-align:center;position:relative;z-index:1;margin-top:16px;color:#9c8d9f;font-size:11px;letter-spacing:.03em}
    .sparkle{position:fixed;z-index:8;pointer-events:none;width:var(--size);height:var(--size);left:var(--x);top:var(--y);border-radius:50%;background:rgba(255,255,255,.98);box-shadow:0 0 5px 1px rgba(255,255,255,.9),0 0 12px 3px rgba(220,174,225,.72),0 0 22px 5px rgba(195,157,213,.28);opacity:0;transform:scale(.2);animation:sparkle-twinkle var(--duration) ease-in-out var(--delay) both;}
    .sparkle:after{content:"";position:absolute;left:50%;top:50%;width:1px;height:calc(var(--size) * 3.8);background:linear-gradient(180deg,transparent,rgba(255,255,255,.95),transparent);transform:translate(-50%,-50%);}
    .card.sparkle-glow{animation:sparkle-card-glow 2.8s ease-out both;}
    @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sparkle-twinkle{0%,100%{opacity:0;transform:scale(.2)}25%{opacity:.95;transform:scale(1)}48%{opacity:.28;transform:scale(.55)}68%{opacity:1;transform:scale(.85)}}
    @keyframes sparkle-card-glow{0%,100%{box-shadow:0 26px 70px #72566c2b,0 5px 0 #e2c9dd,inset 0 0 0 5px #fff9fd,inset 0 0 0 6px #e4cddd}35%{box-shadow:0 26px 78px rgba(170,119,177,.3),0 5px 0 #e2c9dd,inset 0 0 0 5px #fff9fd,inset 0 0 0 6px #e4cddd}}
    @keyframes success-arrive{from{opacity:0;transform:translateY(8px) scale(.985);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
    @keyframes text-glow{0%{text-shadow:0 0 0 rgba(221,174,218,0)}35%{text-shadow:0 0 22px rgba(221,174,218,.65)}100%{text-shadow:0 0 12px rgba(221,174,218,.28)}}
    @keyframes button-dissolve{0%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:0;filter:blur(6px);transform:scale(.96)}}
    @media(max-width:480px){body{padding:15px}.card{border-radius:6px 25px 6px 25px;padding:48px 21px}.card:before{top:13px;left:14px;font-size:24px}.card:after{right:14px;bottom:13px;font-size:24px}h1:before{margin-bottom:18px}p{font-size:14px}button{width:100%;max-width:310px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" id="card">
      <div class="screen" id="secondScreen">
        <h1 class="question">Варвара, ты придёшь на мой день рождения?</h1>
        <div class="button-wrap"><button id="yesButton">Да, приду</button></div>
        <p id="response" class="hidden" role="status" aria-live="polite" style="margin-top:24px;margin-bottom:0">Я буду рад тебя видеть! Я выбираю тебя ❤️</p>
      </div>
    </section>
    <footer>Сделано специально для тебя</footer>
  </main>
  <script>
    const card = document.getElementById('card');
    const response = document.getElementById('response');
    const screen = document.getElementById('secondScreen');
    function sparkleAroundCard() {
      const rect = card.getBoundingClientRect();
      const pad = 26;
      const positions = [];
      for (let i = 0; i < 17; i++) {
        const side = i % 4;
        let x, y;
        if (side === 0) { x = rect.left - pad + Math.random() * (rect.width + pad * 2); y = rect.top - 8 - Math.random() * 20; }
        else if (side === 1) { x = rect.right + 8 + Math.random() * 20; y = rect.top - pad + Math.random() * (rect.height + pad * 2); }
        else if (side === 2) { x = rect.left - pad + Math.random() * (rect.width + pad * 2); y = rect.bottom + 8 + Math.random() * 20; }
        else { x = rect.left - 8 - Math.random() * 20; y = rect.top - pad + Math.random() * (rect.height + pad * 2); }
        positions.push({x:Math.max(4,Math.min(innerWidth - 4,x)),y:Math.max(4,Math.min(innerHeight - 4,y))});
      }
      positions.forEach((p) => {
        const sparkle = document.createElement('span');
        sparkle.className = 'sparkle';
        sparkle.style.setProperty('--x', p.x + 'px');
        sparkle.style.setProperty('--y', p.y + 'px');
        sparkle.style.setProperty('--size', (2 + Math.random() * 3) + 'px');
        sparkle.style.setProperty('--duration', (1.3 + Math.random() * 1.2) + 's');
        sparkle.style.setProperty('--delay', (Math.random() * .55) + 's');
        document.body.appendChild(sparkle);
        sparkle.addEventListener('animationend', () => sparkle.remove(), {once:true});
      });
      card.classList.add('sparkle-glow');
      window.setTimeout(() => card.classList.remove('sparkle-glow'), 2900);
    }
    document.getElementById('yesButton').addEventListener('click', (event) => {
      const button = event.currentTarget;
      if (button.disabled) return;
      button.disabled = true;
      button.setAttribute('aria-pressed', 'true');
      button.classList.add('dissolve');
      screen.classList.add('success');
      response.classList.remove('hidden');
      response.classList.add('success-message');
      button.addEventListener('animationend', () => button.classList.add('hidden'), {once:true});
      sparkleAroundCard();
    });
  </script>
</body>
</html>
