<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2f7">
  <meta name="description" content="Приглашение для Варвары">
  <title>Для Варвары</title>
  <style>
    :root{color-scheme:light;--ink:#403745;--muted:#827785;--accent:#987da8;--line:#e8dfe9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;overflow-x:hidden;background:radial-gradient(ellipse at 15% 10%,#ece2f0 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#f1e7ec 0,transparent 35%),#f7f4f7;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(#c8b6ce .7px,transparent .7px);background-size:26px 26px}
    .shell{width:min(100%,610px);position:relative}
    .card{position:relative;overflow:hidden;text-align:center;padding:clamp(32px,7vw,60px) clamp(22px,6vw,54px);border:1px solid #fff;background:rgba(255,253,253,.88);border-radius:28px;box-shadow:0 22px 70px #65506e12,inset 0 0 0 1px #eee6ef;backdrop-filter:blur(12px);transition:box-shadow .5s}
    .card:before,.card:after{content:"";position:absolute;width:100px;height:100px;border:1px solid #d9c9df;border-radius:50%;opacity:.5;pointer-events:none}
    .card:before{top:-62px;left:-48px;box-shadow:0 0 0 12px #d9c9df15,0 0 0 25px #d9c9df10}
    .card:after{right:-62px;bottom:-65px;box-shadow:0 0 0 12px #d9c9df15,0 0 0 25px #d9c9df10}
    .screen{position:relative;z-index:1;animation:appear .55s ease both}
    .hidden{display:none!important}
    .mark{width:46px;height:46px;margin:0 auto 24px;border:1px solid #d8c8de;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:Georgia,serif;font-size:24px}
    h1{margin:0 auto 20px;max-width:480px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7.5vw,56px);line-height:1.08;letter-spacing:-.035em;font-weight:500;color:#443849}
    .accent{color:#92769f}
    p{margin:0 auto 23px;max-width:430px;font-size:15px;line-height:1.85;color:var(--muted)}
    .button-wrap{margin-top:29px}
    button{appearance:none;border:1px solid #8e7698;border-radius:999px;padding:15px 27px;min-height:52px;font:inherit;font-size:14px;font-weight:650;color:#fff;background:#8e7698;box-shadow:0 7px 20px #78618420;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
    button:hover{transform:translateY(-2px);background:#796382;box-shadow:0 10px 24px #78618430}
    button:active{transform:scale(.98)}
    button:focus-visible{outline:2px solid #bba8c5;outline-offset:4px}
    .question{font-size:clamp(34px,7vw,49px)}
    footer{text-align:center;margin-top:16px;color:#9c8d9f;font-size:11px;letter-spacing:.03em}
    .particle{position:fixed;z-index:10;pointer-events:none;top:-24px;width:8px;height:8px;border-radius:50%;background:#c4a9ce;opacity:0;animation:fall linear forwards;will-change:transform,opacity}
    .particle:nth-child(3n){background:#d9b9c8;width:5px;height:5px}
    .particle:nth-child(3n + 1){background:#e4d7e9;width:10px;height:10px}
    .glow{box-shadow:0 0 0 5px #e5d9eb65,0 25px 90px #9d82aa25,inset 0 0 0 1px #eee6ef}
    @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fall{0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0}12%{opacity:.85}100%{transform:translate3d(var(--drift),110vh,0) rotate(300deg);opacity:0}}
    @media(max-width:480px){body{padding:15px}.card{border-radius:23px;padding:34px 21px}p{font-size:14px}button{width:100%;max-width:310px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" id="card">
      <div class="screen">
        <h1 class="question">Варвара, ты придёшь на мой день рождения?</h1>
        <div class="button-wrap"><button id="yesButton">Да, приду</button></div>
        <p id="response" class="hidden" role="status" aria-live="polite" style="margin-top:24px;margin-bottom:0">Буду очень рад тебя видеть.</p>
      </div>
    </section>
    <footer>Сделано специально для тебя</footer>
  </main>
  <script>
    const card = document.getElementById('card');
    const response = document.getElementById('response');
    function celebrate() {
      for (let i = 0; i < 38; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.animationDuration = (2.8 + Math.random() * 2.8) + 's';
        particle.style.animationDelay = (Math.random() * .7) + 's';
        particle.style.setProperty('--drift', (Math.random() * 150 - 75) + 'px');
        document.body.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove(), {once:true});
      }
      card.classList.add('glow');
      window.setTimeout(() => card.classList.remove('glow'), 1900);
    }
    document.getElementById('yesButton').addEventListener('click', (event) => {
      event.currentTarget.textContent = 'Да!';
      response.classList.remove('hidden');
      celebrate();
    });
  </script>
</body>
</html>
