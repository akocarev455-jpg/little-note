<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2f7">
  <meta name="description" content="Открой, когда будет удобно.">
  <title>Небольшая заметка</title>
  <style>
    :root{color-scheme:light;--ink:#403745;--muted:#827785;--accent:#987da8;--line:#e8dfe9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;overflow-x:hidden;background:radial-gradient(ellipse at 12% 18%,#ead9e9 0,transparent 38%),radial-gradient(ellipse at 88% 82%,#f2dce5 0,transparent 36%),#f8f2f6;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#bfa5bd .7px,transparent .7px);background-size:31px 31px}
    .shell{width:min(100%,610px);position:relative;z-index:1}
    #card{width:100%;height:460px;min-height:460px;max-height:460px;display:grid;grid-template-rows:minmax(0,1fr);align-items:center;justify-items:stretch;box-sizing:border-box}
    #card>.screen{grid-area:1 / 1;min-width:0;max-height:100%;overflow:visible}
    .card{position:relative;display:grid;place-items:center;height:460px;min-height:460px;overflow:hidden;text-align:center;padding:clamp(48px,8vw,72px) clamp(24px,6vw,58px);border:1px solid #cba9c4;background:linear-gradient(135deg,#fff9fd 0%,#fbf0f8 48%,#f3e3f0 100%);border-radius:7px 34px 7px 34px;box-shadow:0 26px 70px #72566c2b,0 5px 0 #e2c9dd,inset 0 0 0 5px #fff9fd,inset 0 0 0 6px #e4cddd;transition:box-shadow .5s}
    .card:before,.card:after{position:absolute;pointer-events:none;color:#d4aec5;font-family:Georgia,serif;font-size:30px;line-height:1;opacity:.8}
    .card:before{content:"✿";top:18px;left:21px}
    .card:after{content:"❀";right:21px;bottom:18px}
    .screen{position:relative;z-index:1;width:100%;animation:appear .55s ease both}
    .intro-screen{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .intro-kicker{margin:0 0 13px;color:#a58aa9;font-family:Georgia,"Times New Roman",serif;font-size:13px;letter-spacing:.24em;text-transform:uppercase}
    .intro-title{margin:0;color:#59445f;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(43px,9vw,64px);line-height:1.05;letter-spacing:-.035em}
    .intro-rule{display:flex;align-items:center;justify-content:center;gap:12px;width:min(230px,80%);margin:21px auto 18px;color:#c39ab8;font-family:Georgia,serif;font-size:18px}
    .intro-rule:before,.intro-rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#d7b8ce)}
    .intro-rule:after{transform:scaleX(-1)}
    .intro-note{margin:0 auto 25px!important;font-family:Georgia,"Times New Roman",serif;font-size:17px!important;font-style:italic;letter-spacing:.015em;color:#8e7a91!important}
    .intro-screen .button-wrap{margin-top:0}
    .intro-screen .open-button{min-width:142px}
    .hidden{display:none!important}
    #response{position:absolute;left:0;right:0;top:0;width:100%;height:52px;min-height:52px;display:flex;align-items:center;justify-content:center;max-width:430px;margin:0 auto;padding:0 6px;font-size:14px;line-height:1.35;pointer-events:none;transform:translateY(8px)}
    #response.hidden{display:flex!important;visibility:hidden}
    .mark{width:46px;height:46px;margin:0 auto 24px;border:1px solid #d8c8de;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:Georgia,serif;font-size:24px}
    h1{margin:0 auto 20px;max-width:480px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7.5vw,56px);line-height:1.08;letter-spacing:-.035em;font-weight:500;color:#443849}
    h1:before{content:"✧  ❀  ✧";display:block;margin:0 auto 22px;color:#b88da9;font-family:Georgia,serif;font-size:23px;letter-spacing:.18em;font-weight:400}
    .accent{color:#92769f}
    p{margin:0 auto 23px;max-width:430px;font-size:15px;line-height:1.85;color:var(--muted)}
    .button-wrap{margin-top:29px;height:52px;min-height:52px;display:flex;align-items:center;justify-content:center;position:relative}
    button{appearance:none;position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(255,255,255,.82);border-radius:999px;padding:15px 32px;min-height:52px;font:inherit;font-size:14px;font-weight:650;letter-spacing:.01em;color:#654d69;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.35) 45%,rgba(235,215,242,.58));box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(167,132,180,.15),0 8px 24px rgba(114,83,126,.13);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
    button:before{content:"";position:absolute;inset:1px 1px auto;height:48%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));z-index:-1;pointer-events:none}
    button:hover{transform:translateY(-1px);background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.48) 45%,rgba(229,205,239,.7));box-shadow:inset 0 1px 1px #fff,inset 0 -1px 2px #a784b426,0 11px 28px #72537e29}
    button:active{transform:scale(.97);box-shadow:inset 0 1px 5px rgba(114,83,126,.16),0 3px 12px rgba(114,83,126,.12)}
    button:focus-visible{outline:2px solid #bba8c5;outline-offset:4px}
    .question{font-size:clamp(34px,7vw,49px)}
    footer{text-align:center;position:relative;z-index:1;margin-top:16px;color:#9c8d9f;font-size:11px;letter-spacing:.03em}
    .celebration-petal{position:fixed;z-index:20;left:0;top:0;width:var(--size);height:var(--size);pointer-events:none;will-change:transform,opacity;animation:petal-drift var(--duration) cubic-bezier(.18,.65,.3,1) forwards;filter:drop-shadow(0 3px 7px rgba(154,113,151,.28));}
    .celebration-petal svg{display:block;width:100%;height:100%;overflow:visible;}
    .card.celebrating{animation:card-celebrate-glow 2.5s ease-out both;}
    .screen.success{animation:success-arrive .35s ease-out both;}
    .success-message{color:#886b91;text-shadow:0 0 14px rgba(221,174,218,.3);}
    button.dissolve{pointer-events:none;animation:button-dissolve .35s ease forwards;}
    button.dissolve.hidden{display:inline-flex!important;visibility:hidden;animation:none;}
    @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cover-open{to{opacity:0;transform:translateY(-5px) scale(.985);filter:blur(2px)}}
    @keyframes petal-drift{0%{transform:translate3d(0,0,0) rotate(var(--rot-start)) scale(.55);opacity:0}10%{opacity:1}25%{opacity:.98}76%{opacity:.85}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot-end)) scale(var(--scale));opacity:0}}
    @keyframes card-celebrate-glow{0%,100%{box-shadow:0 26px 70px #72566c2b,0 5px 0 #e2c9dd,inset 0 0 0 5px #fff9fd,inset 0 0 0 6px #e4cddd}35%{box-shadow:0 26px 76px rgba(170,119,177,.23),0 5px 0 #e2c9dd,inset 0 0 0 5px #fff9fd,inset 0 0 0 6px #e4cddd}}
    @keyframes success-arrive{from{opacity:.35}to{opacity:1}}
    @keyframes button-dissolve{0%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:0;filter:blur(4px);transform:scale(.97)}}
    @media(max-width:480px){body{padding:15px}#card{width:100%;height:460px;min-height:460px;max-height:460px;border-radius:6px 25px 6px 25px;padding:48px 21px}.card:before{top:13px;left:14px;font-size:24px}.card:after{right:14px;bottom:13px;font-size:24px}h1:before{margin-bottom:18px}p{font-size:14px}button{width:100%;max-width:310px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" id="card">
      <div class="screen intro-screen" id="introScreen">
        <p class="intro-kicker">особенное приглашение</p>
        <h1 class="intro-title">Приглашение</h1>
        <div class="intro-rule" aria-hidden="true">✧</div>
        <p class="intro-note">Есть кое-что для тебя…</p>
        <div class="button-wrap"><button class="open-button" id="openButton">Открыть</button></div>
      </div>
      <div class="screen hidden" id="secondScreen">
        <h1 class="question">Варвара, ты придёшь на мой день рождения?</h1>
        <div class="button-wrap"><button id="yesButton">Да, приду</button><p id="response" class="hidden" role="status" aria-live="polite">Я буду рад тебя видеть! Я выбираю тебя ❤️</p></div>
      </div>
    </section>
    <footer>Сделано специально для тебя</footer>
  </main>
  <script>
    const card = document.getElementById('card');
    const response = document.getElementById('response');
    const screen = document.getElementById('secondScreen');
    function celebratePetals() {
      const rect = card.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height * .55;
      const petalSvg = '<svg viewBox="0 0 40 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="petalFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafd"/><stop offset=".45" stop-color="#f0c5df"/><stop offset="1" stop-color="#c99dce"/></linearGradient></defs><path d="M20 2C35 17 39 35 20 62C1 35 5 17 20 2Z" fill="url(#petalFill)" stroke="#bd8db8" stroke-width="1.1"/><path d="M20 8Q24 31 20 57" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="1.4" stroke-linecap="round"/></svg>';
      const colors = ['#f4dce9','#e8d9f0','#fff1f8','#dfc8e8'];
      for (let i = 0; i < 48; i++) {
        const petal = document.createElement('span');
        petal.className = 'celebration-petal';
        petal.innerHTML = petalSvg;
        const angle = (Math.PI * 2 * i / 48) + (Math.random() - .5) * .38;
        const distance = 110 + Math.random() * Math.min(innerWidth, innerHeight) * .48;
        petal.style.left = originX + 'px';
        petal.style.top = originY + 'px';
        petal.style.setProperty('--size', (16 + Math.random() * 14) + 'px');
        petal.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
        petal.style.setProperty('--dy', (Math.sin(angle) * distance - 18) + 'px');
        petal.style.setProperty('--rot-start', (Math.random() * 50 - 25) + 'deg');
        petal.style.setProperty('--rot-end', (Math.random() * 560 - 280) + 'deg');
        petal.style.setProperty('--scale', (0.7 + Math.random() * .65).toFixed(2));
        petal.style.setProperty('--duration', (2.8 + Math.random() * 1.5) + 's');
        petal.style.opacity = '0';
        if (Math.random() < .35) petal.style.filter = 'hue-rotate(12deg) drop-shadow(0 2px 5px rgba(154,113,151,.14))';
        document.body.appendChild(petal);
        petal.addEventListener('animationend', () => petal.remove(), {once:true});
      }
      card.classList.remove('celebrating');
      void card.offsetWidth;
      card.classList.add('celebrating');
      window.setTimeout(() => card.classList.remove('celebrating'), 2600);
    }
    document.getElementById('openButton').addEventListener('click', () => {
      const intro = document.getElementById('introScreen');
      intro.style.animation = 'cover-open .32s ease forwards';
      window.setTimeout(() => {
        intro.classList.add('hidden');
        const questionScreen = document.getElementById('secondScreen');
        questionScreen.classList.remove('hidden');
        questionScreen.style.animation = 'appear .45s ease both';
      }, 280);
    });
    document.getElementById('yesButton').addEventListener('click', (event) => {
      const button = event.currentTarget;
      if (button.disabled) return;
      button.disabled = true;
      button.setAttribute('aria-pressed', 'true');
      button.classList.add('dissolve');
      screen.classList.add('success');
      response.classList.remove('hidden');
      response.classList.add('success-message');
      button.addEventListener('animationend', () => button.classList.add('hidden'), {once:true});
      celebratePetals();
    });
  </script>
</body>
</html>
